name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Cancela a execução antiga da mesma branch ou PR para não gastar minutos de CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A mesma node-version do publish.yml: Node 20 com npm 10 quebrou o `npm ci` do lock.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm test` compila antes e roda `node --test test/*.test.cjs` sobre o dist.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
